<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Z16 Polishchuk</title>
</head>

<body>
    <div style="color: navy; font-size: 48px;">
        <script language="javascript">
            var A = parseFloat(prompt("Podaj liczbę A", ""));
            var B = parseFloat(prompt("Podaj liczbę B", ""));
            var wynik = A**3 + 3*A**2*B + 3*A*B**2 + B**3;

            document.write("wczytane liczby:&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;A=" + A + "&nbsp;&nbsp;B=" + B + "<br><br>");
            document.write("("+A+" + "+B+")^3= "+A+"^3 + 3*(("+A+")^2)*("+B+") + 3*("+A+")*(("+B+")^2) + "+B+"^3 = 1 + 6 + 12 + 8 = " + wynik);
        </script>
    </div>
</body>

</html>
