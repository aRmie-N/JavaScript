<html lang="pl">

<head>

    <title>Osadzanie pliku JS-Polishchuk</title>
    <style>
        body {
            margin: 100px;
            font-size: 25px;
        }
    </style>
</head>

<body>
    <script>
        document.write("•".fontcolor("red") + "Mam numer w dzienniku 15" + "<br>");
        document.write("obramowanie ze znaków +" + "<br>");
        document.write("numer koloru obramowania to 16 --> " + "aqua" .fontcolor("aqua") + "<br>");
        document.write("numer koloru tekstu to 9 --> " + "green" .fontcolor("green") + "<br>")
        document.write("+++++++++++++++++++".fontcolor("aqua") + "<br>");
        document.write("+".fontcolor("aqua") + "&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;Mykhailo"
            .fontcolor("green") + "&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;+"
            .fontcolor("aqua") + "<br>"); 
        document.write("+".fontcolor("aqua") + "&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;Polishchuk"
            .fontcolor("green") +"&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;+".fontcolor("aqua") + "<br>"); 
        document.write("+++++++++++++++++++".fontcolor("aqua") + "<br>");
    </script>
