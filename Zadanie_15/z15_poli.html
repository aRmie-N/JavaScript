<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Z15 Polishchuk</title>
</head>

<body>
    <div style="color: red; font-size: 50px;">
        <script language="javascript">
            var liczba1 = prompt("daj mianownik m =", "");
            var m_pol = parseFloat(liczba1);

            document.write("m= " + m_pol + "<br>");
            var m1 = m_pol * 2;

            document.write("1/" + m_pol + " = 1/" + m1 + " + 1/" + m1 + "<br>");
        </script>
    </div>
</body>

</html>
